name: Engineering checks

on:
  pull_request:
  push:
    branches: [main, master, 'integration/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    defaults:
      run:
        shell: bash
    steps:
      # Official tag refs verified with git ls-remote on 2026-11-04.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.4'
      - name: Configure package-manager cache
        run: printf 'COREPACK_HOME=%s/skillbridge-corepack\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Frozen dependency installation
        run: corepack pnpm install --frozen-lockfile --fetch-retries=0 --fetch-timeout=10000
      - name: Lint
        run: corepack pnpm lint
      - name: Strict typecheck
        run: corepack pnpm typecheck
      - name: Unit and conformance tests
        run: corepack pnpm test
      - name: Build
        run: corepack pnpm build
      - name: Pinned MCP SDK import preflight
        run: |
          set -euo pipefail
          sdk_dir="$(mktemp -d "$RUNNER_TEMP/skillbridge-sdk-preflight.XXXXXX")"
          for asset_name in package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc sdk-import-smoke.mjs; do
            cp "project/evidence/phase-1-completion/sdk/$asset_name" "$sdk_dir/$asset_name"
          done
          corepack pnpm --dir "$sdk_dir" install --frozen-lockfile --ignore-scripts --fetch-retries=0 --fetch-timeout=10000
          corepack pnpm --dir "$sdk_dir" audit --audit-level=low
          node "$sdk_dir/sdk-import-smoke.mjs"
      - name: Task graph and negative tests
        run: |
          set -euo pipefail
          python3 scripts/validate_task_graph.py
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: CI helper negative tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Secret scan
        run: python3 .github/scripts/secret_scan.py
      - name: Dependency vulnerability audit
        run: corepack pnpm audit --audit-level=low
      - name: Reproducible emitted build
        run: python3 .github/scripts/check_reproducible.py
      - name: Local dependency policy and negative tests
        run: |
          set -euo pipefail
          python3 deploy/local/manage.py check
          python3 -m unittest discover -s deploy/local -p 'test_*.py' -v
      - name: Real PostgreSQL and S3 lifecycle
        run: |
          set -euo pipefail
          lifecycle_venv="$(mktemp -d "$RUNNER_TEMP/skillbridge-lifecycle.XXXXXX")"
          python3 -m venv "$lifecycle_venv"
          "$lifecycle_venv/bin/python" -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple --only-binary=:all: --timeout 10 --retries 0 -r deploy/local/requirements-validation.txt
          "$lifecycle_venv/bin/python" deploy/local/verify_lifecycle.py
      - name: Always stop local test services
        if: ${{ always() }}
        run: python3 deploy/local/manage.py down
