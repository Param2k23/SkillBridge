# Fixed local TCP destinations only: this is not a forward proxy.
global
    log stdout format raw local0
    maxconn 128

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend postgres_local
    bind :15432
    default_backend postgres_backend

backend postgres_backend
    server postgres postgres:5432 check resolvers docker init-addr libc,none

frontend s3_local
    bind :19090
    default_backend s3_backend

backend s3_backend
    server s3mock s3mock:9090 check resolvers docker init-addr libc,none
